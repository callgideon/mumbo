name: Mumbo upstream sync

# Fast-forwards `master` to deepseek-ai/deepseek-harness and opens a master -> dev
# merge PR. `master` carries no Mumbo commits, so the fast-forward cannot conflict.
# UPSTREAM_SYNC_TOKEN: PAT with `repo` + `workflow` scopes (upstream changes workflow files).

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      - name: Fast-forward master
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master
          git merge --ff-only upstream/master
          git push origin master
      - name: Open master -> dev PR
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ "$(git rev-list --count origin/dev..master)" = 0 ]; then exit 0; fi
          gh pr list --base dev --head master --state open --json number --jq 'length' | grep -qx 0 || exit 0
          gh pr create --base dev --head master --title "Upstream sync" --body "Merge deepseek-ai/deepseek-harness master into dev (use a merge commit, never squash)."
