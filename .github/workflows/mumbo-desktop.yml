# Unsigned Mumbo desktop DMG for Apple Silicon, kept as a run artifact for internal testing.
name: Mumbo desktop (macOS arm64, unsigned)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-arm64:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: mumbo branding, mumbo account sign-in, no analytics
        run: |
          pnpm exec tsx scripts/mumbo-rebrand.ts
          pnpm exec tsx scripts/mumbo-egress-check.ts
          # Bake the desktop overlay into the bundle the desktop app loads.
          { echo; cat deploy/mumbo-desktop.overlay.yml; } >> packages/bundle/web-app/cordis.patch.yml
      - run: pnpm run package:desktop:mac:arm64:unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: mumbo-mac-arm64-${{ github.run_number }}
          path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Publish to the desktop-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg mumbo-mac-arm64.dmg
          gh release delete desktop-latest --cleanup-tag -y || true
          gh release create desktop-latest mumbo-mac-arm64.dmg --target "$GITHUB_SHA" --title "mumbo for Mac (Apple Silicon)" \
            --notes "Build ${GITHUB_SHA::10}. Unsigned: right-click the app and choose Open the first time."
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-logs-${{ github.run_number }}
          path: apps/desktop/.desktop-build/packaging-runs/
