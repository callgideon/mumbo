# Static and unit gates for pull requests and main.
# Gates read upstream workflow files this fork does not keep, so each job restores them in the runner's tree only.
name: mumbo-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # A long TMPDIR breaks tsx's IPC socket path.
      - name: Use runner-owned temporary storage
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore upstream workflow files the gates read
        run: |
          git fetch --no-tags origin master
          git checkout "$(git merge-base HEAD origin/master)" -- .github/workflows/

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm run check:ci:static

      # Same command as deploy/Dockerfile. Runs last: the rebrand rewrites the runner's tree.
      - name: Egress check (unreviewed DeepSeek hosts)
        run: pnpm exec tsx scripts/mumbo-rebrand.ts && pnpm exec tsx scripts/mumbo-egress-check.ts

  # The unit selection runs as two Vitest shards in parallel; `unit` below passes only when both pass.
  unit-shard:
    name: unit (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Use runner-owned temporary storage
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore upstream workflow files the gates read
        run: |
          git fetch --no-tags origin master
          git checkout "$(git merge-base HEAD origin/master)" -- .github/workflows/

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Sandbox tests need bubblewrap; the script adds it to GITHUB_PATH, which later steps see.
      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Spill and helper-permission tests expect umask 0022. The ci-unit aggregate's two steps, with mumbo's selection:
      # vitest.mumbo-ci.config.ts leaves out the tests scripts/mumbo-ci-unit-exclusions.ts lists.
      - name: Run unit tests
        env:
          DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
        run: |
          umask 0022
          pnpm run build:native-system
          pnpm exec vitest run --config vitest.mumbo-ci.config.ts --shard=${{ matrix.shard }}/2

  unit:
    needs: unit-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Both unit shards passed
        run: test "${{ needs.unit-shard.result }}" = success
