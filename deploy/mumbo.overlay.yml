# Loader overlay (`dsh --patch`): model access uses API-key credentials only. The DeepSeek
# platform sign-in (OAuth to platform.deepseek.com) and its account-token LLM route are off.
# Same disable pattern as packages/bundle/headless/cordis.patch.yml.
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
# Desktop-only product analytics; there is no Mumbo collector yet.
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
# No session-log upload to DeepSeek on model requests.
- id: session-log-deepseek
  disabled: true
# It would name the running release as the harness checkout.
- id: harness-dev-context
  disabled: true
# Fargate allows neither bubblewrap nor Landlock, so `workspace-write` refuses every command.
# Commands run in Full access; the container is the boundary (owner-accepted, 2026-11-08). Bash and file tools ask only to
# escalate the sandbox, and Full access has nothing wider, so plain commands run unprompted; `approval: ask` answers tools' asks.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
# The base sets `never` when DSH_PERMISSION_MODE is danger-full-access, which rejects every ask without prompting.
- id: approval
  config:
    policy: ask
# The default preset is derived from the two rows above, so Full access needs a preset that asks.
# Run Wild (@mumbo/run-wild) is listed only where the box's start script sets MUMBO_RUN_WILD, which it does when it
# mounts that package. It has Full access's knobs, so it stays last: a Session without a recorded preset derives Full
# access. MUMBO_NEW_SESSION_PRESET names the preset new Sessions start in.
- id: permission
  config:
    presets: !!js "({ 'read-only': { sandbox: 'read-only', approval: 'ask' }, 'workspace-write': { sandbox: 'workspace-write', approval: 'ask' }, 'danger-full-access': { sandbox: 'danger-full-access', approval: 'ask' }, ...(process.env.MUMBO_RUN_WILD ? { 'run-wild': { sandbox: 'danger-full-access', approval: 'ask' } } : {}) })"
    defaultPreset: !!js "process.env.MUMBO_NEW_SESSION_PRESET ?? 'danger-full-access'"
