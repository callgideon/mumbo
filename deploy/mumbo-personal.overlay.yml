# Loader overlay (`dsh --patch`) for one person's own machine, applied after mumbo.overlay.yml.
# Full access with an ask per command comes from mumbo.overlay.yml; the machine is the boundary.
# It reads HOME and DSH_HOME from the environment, so the service that runs dsh sets both.
# A patch replaces a row's whole config, so each row restates every key it keeps.
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.HOME + '/projects'
- id: spill-local
  config:
    root: !!js process.env.DSH_HOME + '/spill'
# No session-log suffix on model requests.
- id: session-log-deepseek
  disabled: true
# It would name the running release as the harness checkout.
- id: harness-dev-context
  disabled: true
