# Loader overlay (`dsh --patch`) for a person's box: sidebar links to the box home page and the desktop live view,
# and the Desktop and Browser tabs. The edge writes its public host here, and xauthority only on a display that uses
# the X cookie. The second row keeps the stock iframe Browser tab off.
- insert:
    - id: box-links
      name: '@mumbo/box-links'
      config:
        home: https://boxes.example/home
        desktop: https://boxes.example/desktop/
        browser:
          display: ':1'
          xauthority: /run/x11/auth
- id: ui-sidebar-browser
  disabled: true
