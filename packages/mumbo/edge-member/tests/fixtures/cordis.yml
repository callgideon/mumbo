# Test-only Host: the Web carrier, Connection, the Gateway with remote access, the browser upload and Session log
# routes, and the member plugin.
- id: typert-registry
  name: '@deepseek-ai/dsh-typert-registry'
- id: remote-access
  name: '@deepseek-ai/dsh-api-remote-access'
- id: typert-gateway
  name: '@deepseek-ai/dsh-api-gateway'
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '127.0.0.1'
    port: 0
- id: client-connection
  name: '@deepseek-ai/dsh-client-connection'
- id: file-upload
  name: '@deepseek-ai/dsh-client-file-upload'
- id: session-log-export
  name: '@deepseek-ai/dsh-session-log-export'
- id: mumbo-edge-member
  name: '@mumbo/edge-member'
  config:
    key: !!js process.env.MUMBO_MEMBER_KEY
